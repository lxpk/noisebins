{% extends "base.html" %}
{% block title %}New bin{% endblock %}
{% block body %}
<h1>Register a bin</h1>
{% if not user %}
<p>Sign in to register a bin{% if sso_enabled %} — <a href="{{ login_path('/bins/new') }}">sign in with {{ sso_name }}</a>{% endif %}. API clients can use <a href="/docs">OpenAPI</a> with a JWT.</p>
{% endif %}
<form method="post" action="/bins/new">
  <label>Title <input name="title" required/></label>
  <label>Place
    <select name="noiseplace_id">
      <option value="">—</option>
      {% for p in places %}
      <option value="{{ p.id }}">{{ p.name }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Submit</button>
</form>
{% endblock %}
