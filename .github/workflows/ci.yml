name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noisebins
          POSTGRES_PASSWORD: noisebins
          POSTGRES_DB: noisebins
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noisebins -d noisebins"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg_async://noisebins:noisebins@127.0.0.1:5432/noisebins
      USERS_JWT_SECRET: ci-jwt-secret-must-be-at-least-32-chars
      SECRET_KEY: ci-secret-key-for-fastapi-users-reset-32
      PUBLIC_BASE_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check . && ruff format --check .

      - name: Migrate
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q --ignore=tests/e2e

      - name: Playwright browser
        run: playwright install chromium

      - name: E2E (live server)
        run: |
          uvicorn noisebins.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          pytest tests/e2e -q --base-url=http://127.0.0.1:8000
